<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
        }
        
        .metric-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .metric-value {
            color: #333;
            font-size: 2.5rem;
            font-weight: bold;
        }
        
        .event-feed {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 400px;
            overflow-y: auto;
        }
        
        .event-feed h2 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .event-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .event-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .page_view { background: #e3f2fd; color: #1976d2; }
        .click { background: #f3e5f5; color: #7b1fa2; }
        .purchase { background: #e8f5e8; color: #388e3c; }
        .sign_up { background: #fff3e0; color: #f57c00; }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }
        
        .connected { background: #4caf50; }
        .disconnected { background: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Real-Time Analytics Dashboard</h1>
        
        <div class="connection-status" id="status">Disconnected</div>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Events</div>
                <div class="metric-value" id="totalEvents">0</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Events/Minute</div>
                <div class="metric-value" id="eventsPerMinute">0</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Active Users</div>
                <div class="metric-value" id="activeUsers">0</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Event Types</div>
                <div class="metric-value" id="eventTypes">0</div>
            </div>
        </div>
        
        <div class="event-feed">
            <h2>Live Event Feed</h2>
            <div id="eventFeed"></div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
        let ws;
        const backendUrl = window.BACKEND_URL || window.location.origin;
        const backend = new URL(backendUrl);
        const statusDiv = document.getElementById('status');
        const eventFeed = document.getElementById('eventFeed');
        
        function connectWebSocket() {
            const protocol = backend.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${backend.host}/ws`);
            
            ws.onopen = () => {
                statusDiv.textContent = 'Connected';
                statusDiv.className = 'connection-status connected';
            };
            
            ws.onclose = () => {
                statusDiv.textContent = 'Disconnected';
                statusDiv.className = 'connection-status disconnected';
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.total_events !== undefined) {
                    // Metrics update
                    updateMetrics(data);
                } else {
                    // Individual event
                    addEventToFeed(data);
                }
            };
        }
        
        function updateMetrics(metrics) {
            document.getElementById('totalEvents').textContent = metrics.total_events;
            document.getElementById('eventsPerMinute').textContent = Math.round(metrics.events_per_minute);
            document.getElementById('activeUsers').textContent = metrics.active_users;
            document.getElementById('eventTypes').textContent = 
                Object.keys(metrics.event_type_distribution).length;
        }
        
        function addEventToFeed(event) {
            const eventDiv = document.createElement('div');
            eventDiv.className = 'event-item';
            
            const eventType = event.type.replace('_', ' ');
            eventDiv.innerHTML = `
                <span class="event-type ${event.type}">${eventType}</span>
                <span>User: ${event.user_id.substring(0, 8)}...</span>
                <span style="float: right; color: #999;">
                    ${new Date(event.timestamp).toLocaleTimeString()}
                </span>
            `;
            
            eventFeed.insertBefore(eventDiv, eventFeed.firstChild);
            
            while (eventFeed.children.length > 50) {
                eventFeed.removeChild(eventFeed.lastChild);
            }
        }
        
        function simulateEvents() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const eventTypes = ['page_view', 'click', 'purchase', 'sign_up'];
            const randomEvent = {
                id: crypto.randomUUID(),
                type: eventTypes[Math.floor(Math.random() * eventTypes.length)],
                user_id: `user_${Math.floor(Math.random() * 100)}`,
                session_id: crypto.randomUUID(),
                timestamp: new Date().toISOString(),
                properties: JSON.stringify({
                    page: `/page_${Math.floor(Math.random() * 10)}`,
                    referrer: 'direct'
                })
            };
            
            ws.send(JSON.stringify(randomEvent));
        }
        
        connectWebSocket();
        
        setInterval(simulateEvents, 2000);
    </script>
</body>
</html>
